## Machine-specific. Not for version control.
# Forward slashes on purpose: this is a java.util.Properties file, where a
# backslash starts an escape sequence, so a Windows path written with single
# backslashes silently loses them all and the SDK "cannot be found" at a path
# that looks almost right in the error message.
sdk.dir=C:/Users/devan/AppData/Local/Android/Sdk
