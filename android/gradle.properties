org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# compileSdk 35 is newer than the AGP 8.5.2 in use was tested against, which is
# deliberate: android-35 is the only platform installed and nothing here depends
# on API 35 behaviour (targetSdk stays 34). The warning is noise, not a finding.
android.suppressUnsupportedCompileSdk=35
